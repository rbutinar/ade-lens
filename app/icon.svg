<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ade-lens">
  <!-- ADE family mark. Brand tile: slate-800, matching the top navigation bar. -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#1e293b"/>
  <!-- Lineage edges: three source platforms converging on the catalog node. -->
  <g stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" opacity="0.7">
    <line x1="10" y1="9"  x2="22" y2="16"/>
    <line x1="10" y1="16" x2="22" y2="16"/>
    <line x1="10" y1="23" x2="22" y2="16"/>
  </g>
  <!-- Convergence node (sky-400, the accent from the wordmark). -->
  <circle cx="22" cy="16" r="4" fill="#38bdf8"/>
  <!-- Source platforms, canonical colours from core/platform_style.py. -->
  <circle cx="10" cy="9"  r="3" fill="#e8a33d"/> <!-- Power BI -->
  <circle cx="10" cy="16" r="3" fill="#ee4b2b"/> <!-- Databricks -->
  <circle cx="10" cy="23" r="3" fill="#0f9d58"/> <!-- Fabric -->
</svg>
